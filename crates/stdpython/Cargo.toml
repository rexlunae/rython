[package]
name = "stdpython"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python standard library runtime for the Rython compiler ecosystem"
documentation = "https://docs.rs/stdpython"
homepage.workspace = true
readme = "README.md"
keywords = ["python", "runtime", "stdlib", "transpiler", "no-std"]
categories = ["development-tools", "no-std"]

# Feature ladder (no_std-by-absence): core ⊂ alloc ⊂ std.
#   --no-default-features --features alloc  → #![no_std] + alloc (strings,
#     lists, dicts, exceptions — everything that doesn't touch the OS)
#   default ("std")                          → the full runtime
# A strictly-core tier (no alloc) is not implemented yet and fails loudly.
[features]
default = ["std", "ssl-rustls"]
std = ["alloc", "dep:pyo3", "dep:libc", "dep:getrandom", "dep:regex", "indexmap/std"]
alloc = ["dep:hashbrown", "dep:libm", "dep:md-5", "dep:sha1", "dep:sha2"]

# numpy backends: "numpy" (or none) = always-on sequential engine;
# numpy-rayon / numpy-simd / numpy-cuda / numpy-vulkan enable the
# accelerated engines (chosen at runtime via np.set_backend or the
# RYPY_NUMPY_BACKEND env var / --numpy-backend flag).
numpy-rayon = ["dep:rayon"]
numpy-simd = []
numpy-cuda = []
numpy-vulkan = []

# The asyncio module (asyncio.run / asyncio.sleep) maps onto the tokio
# runtime. Generated async BINARIES enable this on their stdpython
# dependency; plain async library crates (which never call asyncio) do not
# need it.
async-tokio = ["std", "dep:tokio", "tokio/rt-multi-thread", "tokio/time", "tokio/macros"]

# The urllib.request module (HTTP/HTTPS client) wraps the ureq crate —
# the platform-surface convention: one feature per surface, named
# <module>-<backend>. rypip enables it on the generated crate's stdpython
# dependency when the converted package imports urllib.request; the
# default build stays dependency-light.
http-ureq = ["std", "dep:ureq", "ureq/rustls"]

# The ssl module (TLS) has two mutually exclusive backends:
# ssl-rustls (default) — client-side TLS over the rustls crate (the
# common urllib3/requests path); ssl-openssl — the full CPython ssl
# surface over the system OpenSSL/LibreSSL via the openssl crate
# (CERT_OPTIONAL half-verification, set_ciphers, client certificates,
# server-side sockets). Enabling ssl-openssl replaces the backend; the
# rustls backend stays on by default (TLS is load-bearing for the top
# converted packages); turn it off with --no-default-features.
ssl-rustls = ["std", "dep:rustls", "dep:rustls-pemfile", "dep:webpki-roots"]
ssl-openssl = ["std", "dep:openssl", "dep:openssl-sys"]

[dependencies]
pyo3 = {version = "0.29", features=["auto-initialize"], optional = true}
paste = "1.0"
rayon = { version = "1.10", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"], optional = true }
indexmap = { version = "2", default-features = false }
getrandom = { version = "0.3", optional = true }
hashbrown = { version = "0.15", optional = true }
libm = { version = "0.2", optional = true }
regex = { version = "1", optional = true }
md-5 = { version = "0.10", optional = true, default-features = false }
sha1 = { version = "0.10", optional = true, default-features = false }
sha2 = { version = "0.10", optional = true, default-features = false }
libc = { version = "0.2", optional = true }
ureq = { version = "3", optional = true, default-features = false }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12", "logging"] }
openssl = { version = "0.10", optional = true, default-features = false }
openssl-sys = { version = "0.9", optional = true }
rustls-pemfile = { version = "2", optional = true }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
# Test-only X.509 generation for the TLS handshake smoke tests (each
# ssl backend's test spins up a local server with a self-signed cert).
rcgen = "0.13"

[[bin]]
name = "comprehensive_rollout_summary"
required-features = ["std"]

# These suites pin OS-facing behavior (I/O, os.path, datetime, entropy…);
# nostd_basic.rs stays feature-agnostic and builds on every tier.
[[test]]
name = "python_semantics"
required-features = ["std"]

[[test]]
name = "timestamp_tz"
required-features = ["std"]

[[test]]
name = "integration_manual"
required-features = ["std"]

[[test]]
name = "integration_comprehensive"
required-features = ["std"]

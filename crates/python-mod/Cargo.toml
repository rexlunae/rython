[package]
name = "python-mod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Proc-macros that compile Python modules into Rust at build time (the Rython toolchain)"
documentation = "https://docs.rs/python-mod"
homepage.workspace = true
readme = "README.md"
keywords = ["python", "macro", "transpiler", "compile-time"]
categories = ["development-tools", "compilers"]

[lib]
proc-macro = true

[dependencies]
quote = "1.0"
proc-macro-error2 = "2.0"
path_macro = "1.0"
python-ast.workspace = true
proc-macro2 = "1.0.76"

[dev-dependencies]
# The generated modules start with `use stdpython::*`, so integration
# tests that invoke python_module! need the runtime in scope.
stdpython.workspace = true

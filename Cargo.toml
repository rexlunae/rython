[workspace]
resolver = "2"
members = [
    "crates/python-ast",
    "crates/python-mod",
    "crates/rypip",
    "crates/rythonc",
    "crates/rykernel-shim",
    "crates/stdpython",
]
# Example crates (and the crates rypip generates inside examples/) build
# standalone — each carries its own [workspace] table.
exclude = ["examples"]

[workspace.package]
version = "1.2.0"
edition = "2024"
# The floor the tree actually needs: python-ast's `if let` match
# guards (E0658 on older stables, issue #208). Verify before lowering.
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/rexlunae/rython"
homepage = "https://github.com/rexlunae/rython"

# Path dependencies carry the workspace version so `cargo publish` can
# rewrite them into registry dependencies; without a version, publishing
# any dependent crate fails outright.
[workspace.dependencies]
python-ast = { path = "crates/python-ast", version = "1.2.0" }
python-mod = { path = "crates/python-mod", version = "1.2.0" }
rythonc = { path = "crates/rythonc", version = "1.2.0" }
stdpython = { path = "crates/stdpython", version = "1.2.0" }

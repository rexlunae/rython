[workspace]
resolver = "2"
members = [
    "crates/python-ast",
    "crates/python-mod",
    "crates/rypip",
    "crates/rythonc",
    "crates/rykernel-shim",
    "crates/stdpython",
]
# Example crates (and the crates rypip generates inside examples/) build
# standalone — each carries its own [workspace] table.
exclude = ["examples"]

[workspace.package]
version = "1.2.0"
edition = "2024"
# The floor, verified by building the workspace on each release: 1.95
# stabilized the `if let` match guards python-ast uses (call.rs,
# class_def.rs), and 1.94 rejects them with five E0658s that name a
# tracking issue rather than the toolchain. rust-toolchain.toml pins
# `stable`, so CI never sees this — a pinned-older stable, a distro
# toolchain or a downstream crates.io consumer does (issue #208).
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/rexlunae/rython"
homepage = "https://github.com/rexlunae/rython"

# Path dependencies carry the workspace version so `cargo publish` can
# rewrite them into registry dependencies; without a version, publishing
# any dependent crate fails outright.
[workspace.dependencies]
python-ast = { path = "crates/python-ast", version = "1.2.0" }
python-mod = { path = "crates/python-mod", version = "1.2.0" }
rythonc = { path = "crates/rythonc", version = "1.2.0" }
stdpython = { path = "crates/stdpython", version = "1.2.0" }

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  sweep-accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sweep accounting tests (no package downloads or Rust builds)
        run: python3 -m unittest discover -s eval/sweep -p 'test_*.py'

  # Native Rust jobs embed CPython through PyO3. Select it before restoring
  # Rust artifacts, and keep caches separate for each Python version.
  # The idiom oracle needs math.sumprod (Python 3.12+).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Select Python for PyO3
        env:
          RYTHON_CI_PYTHON: ${{ steps.python.outputs.python-path }}
          RYTHON_CI_PYTHON_VERSION: ${{ steps.python.outputs.python-version }}
        run: |
          echo "PYO3_PYTHON=$RYTHON_CI_PYTHON" >> "$GITHUB_ENV"
          echo "PYO3_ENVIRONMENT_SIGNATURE=cpython-$RYTHON_CI_PYTHON_VERSION" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-key: cpython-${{ steps.python.outputs.python-version }}
      - name: Build all crates
        run: cargo build --workspace --all-targets
      - name: Run tests
        run: cargo test --workspace --all-targets

  # no_std tier: keeps the alloc build honest so it can't silently rot.
  nostd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build stdpython (no_std + alloc)
        run: cargo build -p stdpython --no-default-features --features alloc --all-targets
      - name: Test stdpython (no_std + alloc)
        run: cargo test -p stdpython --no-default-features --features alloc
      # A bare-metal target has no std to fall back on, so this also catches
      # any dependency quietly linking std.
      - name: Cross-check on bare-metal (thumbv7m-none-eabi)
        run: |
          rustup target add thumbv7m-none-eabi
          cargo check -p stdpython --no-default-features --features alloc --target thumbv7m-none-eabi

  # The numpy backend features: the rayon kernels (including the x86_64
  # AVX2 matmul, compiled only with numpy-rayon) have no other CI build,
  # which is how #425's compile error reached main unnoticed.
  numpy-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Select Python for PyO3
        env:
          RYTHON_CI_PYTHON: ${{ steps.python.outputs.python-path }}
          RYTHON_CI_PYTHON_VERSION: ${{ steps.python.outputs.python-version }}
        run: |
          echo "PYO3_PYTHON=$RYTHON_CI_PYTHON" >> "$GITHUB_ENV"
          echo "PYO3_ENVIRONMENT_SIGNATURE=cpython-$RYTHON_CI_PYTHON_VERSION" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-key: cpython-${{ steps.python.outputs.python-version }}
      - name: Test stdpython (numpy-rayon + numpy-simd)
        run: cargo test -p stdpython --features numpy-rayon,numpy-simd

  # The idiom corpus: small idiomatic programs that must convert, build, and
  # print exactly what CPython prints. A ratchet, not a gate: it fails only
  # when a program gets worse than eval/idioms/baseline.json records (a
  # lower stage, or more rustc errors at build-failed); a red frontier is
  # allowed, a retreating one is not.
  idioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Select Python for PyO3
        env:
          RYTHON_CI_PYTHON: ${{ steps.python.outputs.python-path }}
          RYTHON_CI_PYTHON_VERSION: ${{ steps.python.outputs.python-version }}
        run: |
          echo "PYO3_PYTHON=$RYTHON_CI_PYTHON" >> "$GITHUB_ENV"
          echo "PYO3_ENVIRONMENT_SIGNATURE=cpython-$RYTHON_CI_PYTHON_VERSION" >> "$GITHUB_ENV"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-key: cpython-${{ steps.python.outputs.python-version }}
      - name: Build the converter
        run: cargo build -p python-ast -p rypip
      - name: Idiom corpus (regression ratchet)
        run: python3 eval/idioms/run_idioms.py --check-baseline
